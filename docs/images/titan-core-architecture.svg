<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc"><title id="title">Titan-Core manifest-driven platform map</title><desc id="desc">Map of the Titan-Core Laravel module snapshot from TitanCore and TitanSDK namespaces through service providers and manifests to Filament surfaces, health checks, routes, migrations, repair recipes, and tests.</desc><defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#10223e"/><stop offset="1" stop-color="#183d61"/></linearGradient><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3 0 6z" fill="#93c5fd"/></marker></defs><rect width="1200" height="440" rx="24" fill="url(#bg)"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="52" y="52" fill="#93c5fd" font-size="13" font-weight="700" letter-spacing="3">LEGACY SNAPSHOT � SOURCE-BACKED PLATFORM MAP</text><text x="52" y="91" fill="#f8fafc" font-size="26" font-weight="800">Manifests make platform capability visible</text><text x="52" y="118" fill="#dbeafe" font-size="13">Active maintenance and runtime readiness remain unverified.</text><g stroke="#60a5fa" stroke-width="2" fill="#17375b"><rect x="50" y="170" width="200" height="88" rx="14"/><rect x="325" y="170" width="220" height="88" rx="14"/><rect x="620" y="170" width="220" height="88" rx="14"/><rect x="915" y="170" width="235" height="88" rx="14"/></g><g stroke="#93c5fd" stroke-width="3" marker-end="url(#a)"><path d="M250 214H318"/><path d="M545 214H613"/><path d="M840 214H908"/></g><g fill="#f8fafc" text-anchor="middle"><text x="150" y="202" font-size="16" font-weight="700">TitanCore + SDK</text><text x="150" y="227" font-size="12" fill="#bfdbfe">namespaces � module source</text><text x="435" y="202" font-size="16" font-weight="700">Service providers</text><text x="435" y="227" font-size="12" fill="#bfdbfe">Laravel registration</text><text x="730" y="202" font-size="16" font-weight="700">Manifests</text><text x="730" y="227" font-size="12" fill="#bfdbfe">capabilities � routes � migrations</text><text x="1032" y="202" font-size="16" font-weight="700">Operations</text><text x="1032" y="227" font-size="12" fill="#bfdbfe">health � Filament � repair</text></g><rect x="260" y="325" width="680" height="62" rx="12" fill="#3b2a1a" stroke="#fbbf24"/><text x="600" y="351" fill="#fef3c7" text-anchor="middle" font-size="14" font-weight="700">TESTS + DOCS</text><text x="600" y="374" fill="#fde68a" text-anchor="middle" font-size="12">provider registration � capabilities � APIs � operational services</text></g></svg>

